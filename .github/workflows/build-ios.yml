name: Build iOS IPA (Debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 关键修复：强制切换到 Xcode 26.5
      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      - name: 还原依赖 (仅 iOS)
        run: dotnet restore -p:TargetFramework=net9.0-ios

      - name: 编译生成 .ipa (Debug 模式)
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:ArchiveOnBuild=true \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:TargetFrameworks=net9.0-ios \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ipa
          path: OpenUtauMobile/bin/Debug/net9.0-ios/ios-arm64/publish/*.ipa
