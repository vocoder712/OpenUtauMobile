name: Reusable iOS ARM64 Mono AOT Build

on:
  workflow_call:
    inputs:
      version:
        description: User-visible product version
        required: true
        type: string
      build_number:
        description: Build number supplied by the caller workflow
        required: true
        type: number
      source_sha:
        description: Exact commit being built
        required: true
        type: string
      action_run_id:
        description: Caller workflow run ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    name: iOS ARM64 Mono AOT unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect Build Metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/ios-arm64-logs"

      - name: Validate iOS Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::.NET and installed workloads"
          dotnet --info
          dotnet workload list
          echo "::endgroup::"

          echo "::group::Xcode and iPhoneOS SDK"
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Required Xcode developer directory is missing: $DEVELOPER_DIR"
            ls -1d /Applications/Xcode_*.app 2>/dev/null | sed -n '1,20p' || true
            exit 1
          fi

          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          if [[ "$XCODE_VERSION" != "26.6" && "$XCODE_VERSION" != 26.6.* ]]; then
            echo "::error::Expected Xcode 26.6, selected $XCODE_VERSION from $DEVELOPER_DIR"
            exit 1
          fi

          echo "Developer directory: $DEVELOPER_DIR"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "::endgroup::"

      - name: Restore iOS Workload
        shell: bash
        run: |
          set -euo pipefail

          dotnet workload restore \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            --verbosity minimal

      - name: Validate Mono AOT Properties
        shell: bash
        run: |
          set -euo pipefail

          APP_PROPERTIES="$(dotnet msbuild \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -nologo \
            -getProperty:Configuration,TargetFramework,RuntimeIdentifier,PublishAot,_UseNativeAot,UseMonoRuntime,MtouchUseLlvm,UseInterpreter,MtouchInterpreter,TrimMode,MtouchLink,EnableAssemblyILStripping,_IsDedupEnabled,EnableCodeSigning \
            -p:_IsPublishing=true \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:PublishAot=false \
            -p:UseMonoRuntime=true \
            -p:MtouchUseLlvm=false \
            -p:UseInterpreter=false \
            -p:TrimMode=copy \
            -p:MtouchLink=None \
            -p:EnableAssemblyILStripping=false \
            -p:_IsDedupEnabled=false \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=true)"
          echo "$APP_PROPERTIES"

          REQUIRED_PROPERTIES=(
            '"Configuration": "Release"'
            '"TargetFramework": "net10.0-ios"'
            '"RuntimeIdentifier": "ios-arm64"'
            '"PublishAot": "false"'
            '"UseMonoRuntime": "true"'
            '"MtouchUseLlvm": "false"'
            '"UseInterpreter": "false"'
            '"TrimMode": "copy"'
            '"MtouchLink": "None"'
            '"EnableAssemblyILStripping": "false"'
            '"_IsDedupEnabled": "false"'
            '"EnableCodeSigning": "false"'
          )

          for PROPERTY in "${REQUIRED_PROPERTIES[@]}"; do
            if ! grep -Fq "$PROPERTY" <<< "$APP_PROPERTIES"; then
              echo "::error::Resolved iOS build properties are missing $PROPERTY"
              exit 1
            fi
          done

          if grep -Fq '"_UseNativeAot": "true"' <<< "$APP_PROPERTIES"; then
            echo "::error::iOS entry project unexpectedly selected NativeAOT"
            exit 1
          fi

      - name: Publish iOS ARM64 Mono AOT Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_DIR="${GITHUB_WORKSPACE}/artifacts/ios-arm64"
          IPA_PATH="$IPA_DIR/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-mono-aot-unsigned.ipa"
          mkdir -p "$IPA_DIR"

          dotnet publish \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            --force \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            -p:Version="${{ inputs.version }}" \
            -p:BuildNumber=${{ inputs.build_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ inputs.source_sha }} \
            -p:ActionRunId=${{ inputs.action_run_id }} \
            -p:PublishAot=false \
            -p:UseMonoRuntime=true \
            -p:MtouchUseLlvm=false \
            -p:UseInterpreter=false \
            -p:TrimMode=copy \
            -p:MtouchLink=None \
            -p:EnableAssemblyILStripping=false \
            -p:_IsDedupEnabled=false \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=true \
            -p:IpaPackagePath="$IPA_PATH" \
            -bl:"${GITHUB_WORKSPACE}/artifacts/ios-arm64-logs/build.binlog" \
            --verbosity minimal

          ls -lh "$IPA_PATH"

      - name: Validate iOS ARM64 Mono AOT Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_PATH="${GITHUB_WORKSPACE}/artifacts/ios-arm64/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-mono-aot-unsigned.ipa"
          VERIFY_DIR="${RUNNER_TEMP}/opum-ios-arm64-verify"

          unzip -tq "$IPA_PATH"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"

          APP_COUNT="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          if [ "$APP_COUNT" != "1" ]; then
            echo "::error::IPA must contain exactly one app bundle, found $APP_COUNT"
            exit 1
          fi

          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          INFO_PLIST="$APP_DIR/Info.plist"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$INFO_PLIST")"
          DISPLAY_VERSION="$(plutil -extract CFBundleShortVersionString raw "$INFO_PLIST")"
          BUILD_VERSION="$(plutil -extract CFBundleVersion raw "$INFO_PLIST")"
          PLATFORM="$(plutil -extract CFBundleSupportedPlatforms.0 raw "$INFO_PLIST")"
          ARCHS="$(lipo -archs "$APP_DIR/$EXECUTABLE")"
          EXPECTED_BUNDLE_ID="$(dotnet msbuild \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -nologo \
            -getProperty:ApplicationId \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64)"

          if [ "$BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::Bundle ID is $BUNDLE_ID, expected $EXPECTED_BUNDLE_ID"
            exit 1
          fi
          if [ "$DISPLAY_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::CFBundleShortVersionString is $DISPLAY_VERSION, expected ${{ inputs.version }}"
            exit 1
          fi
          if [ "$BUILD_VERSION" != "${{ inputs.build_number }}" ]; then
            echo "::error::CFBundleVersion is $BUILD_VERSION, expected ${{ inputs.build_number }}"
            exit 1
          fi
          if [ "$PLATFORM" != "iPhoneOS" ]; then
            echo "::error::IPA targets $PLATFORM instead of iPhoneOS"
            exit 1
          fi
          if [ "$ARCHS" != "arm64" ]; then
            echo "::error::App executable architectures are $ARCHS instead of arm64"
            exit 1
          fi
          if [ -e "$APP_DIR/_CodeSignature" ] || [ -e "$APP_DIR/embedded.mobileprovision" ]; then
            echo "::error::App bundle unexpectedly contains signing assets"
            exit 1
          fi
          if codesign --verify --deep --strict "$APP_DIR" 2>"$VERIFY_DIR/codesign.txt"; then
            echo "::error::App bundle unexpectedly passed code-sign verification"
            exit 1
          fi

          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $DISPLAY_VERSION ($BUILD_VERSION)"
          echo "Platform: $PLATFORM"
          echo "Architectures: $ARCHS"
          echo "Code signature: unsigned, verified"

      - name: Upload iOS Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-arm64-mono-aot-diagnostics
          path: |
            artifacts/ios-arm64-logs
            OpenUtauMobile.iOS/obj/project.assets.json
            OpenUtauMobile.iOS/obj/**/mobile/**
            OpenUtauMobile.iOS/obj/**/*.aotdata.*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload iOS ARM64 Mono AOT Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-arm64-mono-aot-unsigned
          path: artifacts/ios-arm64/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-mono-aot-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
