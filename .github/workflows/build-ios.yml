name: Reusable iOS Mono AOT Experiment

on:
  workflow_call:
    inputs:
      version:
        description: User-visible product version
        required: true
        type: string
      build_number:
        description: Build number supplied by the caller workflow
        required: true
        type: number
      source_sha:
        description: Exact commit being built
        required: true
        type: string
      action_run_id:
        description: Caller workflow run ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    name: iOS AOT / ${{ matrix.variant }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: current-control
            configuration: Release
            shared_ios_tfm: false
            sdk_defaults: false
            mtouch_link: ""
          - variant: fork-debug-ios-tfm
            configuration: Debug
            shared_ios_tfm: true
            sdk_defaults: true
            mtouch_link: None
          - variant: fork-release-ios-tfm
            configuration: Release
            shared_ios_tfm: true
            sdk_defaults: true
            mtouch_link: None
          - variant: fork-debug-net10
            configuration: Debug
            shared_ios_tfm: false
            sdk_defaults: true
            mtouch_link: None
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MONO_LOG_LEVEL: debug
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show Experiment Configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.shared_ios_tfm }}" == "true" ]]; then
            SHARED_IOS_TFM=enabled
          else
            SHARED_IOS_TFM=disabled
          fi
          if [[ "${{ matrix.sdk_defaults }}" == "true" ]]; then
            EXPLICIT_AOT_PROPERTIES=no
          else
            EXPLICIT_AOT_PROPERTIES=yes
          fi
          MTOUCH_LINK="${{ matrix.mtouch_link }}"
          if [[ -z "$MTOUCH_LINK" ]]; then
            MTOUCH_LINK="SDK default"
          fi

          echo "=== iOS Mono AOT Experiment ==="
          echo "Variant: ${{ matrix.variant }}"
          echo "Configuration: ${{ matrix.configuration }}"
          echo "RID: ios-arm64"
          echo "Shared iOS TFM: $SHARED_IOS_TFM"
          echo "MtouchLink: $MTOUCH_LINK"
          echo "Explicit AOT properties: $EXPLICIT_AOT_PROPERTIES"

      - name: Show iOS Toolchain Summary
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::.NET and installed workloads"
          dotnet --info
          dotnet workload list
          echo "::endgroup::"

          echo "::group::Xcode and iPhoneOS SDK"
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Required Xcode developer directory is missing: $DEVELOPER_DIR"
            ls -1d /Applications/Xcode_*.app 2>/dev/null | sed -n '1,20p' || true
            exit 1
          fi
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          if [[ "$XCODE_VERSION" != "26.6" && "$XCODE_VERSION" != 26.6.* ]]; then
            echo "::error::Expected Xcode 26.6, selected $XCODE_VERSION from $DEVELOPER_DIR"
            exit 1
          fi
          echo "Developer directory: $DEVELOPER_DIR"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "::endgroup::"

      - name: Add Temporary iOS Target Frameworks
        if: matrix.shared_ios_tfm
        shell: bash
        run: |
          set -euo pipefail

          PROJECTS=(
            OpenUtauMobile/OpenUtauMobile.csproj
            OpenUtau.Core/OpenUtau.Core.csproj
            OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj
            OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj
          )
          for PROJECT in "${PROJECTS[@]}"; do
            python3 - "$PROJECT" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          old = "<TargetFramework>net10.0</TargetFramework>"
          new = ("<TargetFrameworks>net10.0</TargetFrameworks>\n"
                 "        <TargetFrameworks Condition=\"$([MSBuild]::IsOSPlatform('osx'))\">"
                 "net10.0;net10.0-ios</TargetFrameworks>")
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one net10.0 TargetFramework in {path}")
          path.write_text(source.replace(old, new))
          PY
          done

          git diff --check
          git diff -- "${PROJECTS[@]}"

      - name: Restore iOS Workload
        shell: bash
        run: |
          set -euo pipefail

          dotnet workload restore \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            --verbosity minimal

      - name: Show Resolved MSBuild Properties
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES=(
            Configuration TargetFramework RuntimeIdentifier PublishAot
            _UseNativeAot UseMonoRuntime MtouchUseLlvm UseInterpreter
            MtouchInterpreter TrimMode MtouchLink EnableAssemblyILStripping
            _IsDedupEnabled
          )
          PROPERTY_LIST="$(IFS=,; echo "${PROPERTIES[*]}")"
          EXTRA_PROPERTIES=()
          if [[ "${{ matrix.sdk_defaults }}" == "false" ]]; then
            EXTRA_PROPERTIES+=(
              -p:PublishAot=false
              -p:MtouchUseLlvm=false
              -p:UseInterpreter=false
              -p:TrimMode=copy
              -p:EnableAssemblyILStripping=false
              -p:_IsDedupEnabled=false
            )
          fi
          if [[ -n "${{ matrix.mtouch_link }}" ]]; then
            EXTRA_PROPERTIES+=("-p:MtouchLink=${{ matrix.mtouch_link }}")
          fi

          dotnet msbuild \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -nologo \
            -getProperty:"$PROPERTY_LIST" \
            -p:Configuration=${{ matrix.configuration }} \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=false \
            "${EXTRA_PROPERTIES[@]}"

      - name: Publish iOS Mono AOT Experiment
        id: publish
        shell: bash
        run: |
          set +e

          DIAGNOSTICS_DIR="${GITHUB_WORKSPACE}/artifacts/ios-aot-experiment-${{ matrix.variant }}"
          mkdir -p "$DIAGNOSTICS_DIR"
          EXTRA_PROPERTIES=()
          if [[ "${{ matrix.sdk_defaults }}" == "false" ]]; then
            EXTRA_PROPERTIES+=(
              -p:PublishAot=false
              -p:MtouchUseLlvm=false
              -p:UseInterpreter=false
              -p:TrimMode=copy
              -p:EnableAssemblyILStripping=false
              -p:_IsDedupEnabled=false
            )
          fi
          if [[ -n "${{ matrix.mtouch_link }}" ]]; then
            EXTRA_PROPERTIES+=("-p:MtouchLink=${{ matrix.mtouch_link }}")
          fi

          dotnet publish \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -f net10.0-ios \
            -r ios-arm64 \
            -c ${{ matrix.configuration }} \
            -p:Version="${{ inputs.version }}" \
            -p:BuildNumber=${{ inputs.build_number }} \
            -p:BuildTimestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -p:BuildMachine="${RUNNER_OS} / $(uname -srm)" \
            -p:SourceCommit=${{ inputs.source_sha }} \
            -p:ActionRunId=${{ inputs.action_run_id }} \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=false \
            "${EXTRA_PROPERTIES[@]}" \
            -bl:"$DIAGNOSTICS_DIR/build.binlog" \
            --verbosity minimal
          PUBLISH_EXIT_CODE=$?
          if [[ "$PUBLISH_EXIT_CODE" -eq 0 ]]; then
            RESULT=success
          else
            RESULT=failure
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "$RESULT" > "$DIAGNOSTICS_DIR/result.txt"
          exit "$PUBLISH_EXIT_CODE"

      - name: Upload Experiment Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-aot-experiment-${{ matrix.variant }}
          if-no-files-found: warn
          path: |
            artifacts/ios-aot-experiment-${{ matrix.variant }}/build.binlog
            artifacts/ios-aot-experiment-${{ matrix.variant }}/result.txt
            **/obj/**/project.assets.json
            **/obj/**/mobile/**
            **/obj/**/*.aotdata.*
            **/bin/**/*.aotdata.*

      - name: Write Experiment Summary
        if: always()
        shell: bash
        env:
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
        run: |
          RESULT="${PUBLISH_RESULT:-not-run}"
          if [[ "${{ matrix.shared_ios_tfm }}" == "true" ]]; then
            SHARED_IOS_TFM=Yes
          else
            SHARED_IOS_TFM=No
          fi
          if [[ "${{ matrix.sdk_defaults }}" == "true" ]]; then
            SDK_DEFAULTS=Yes
          else
            SDK_DEFAULTS=No
          fi
          {
            echo "## iOS Mono AOT Experiment"
            echo
            echo "| Variant | Config | Shared iOS TFM | SDK defaults | Result |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| ${{ matrix.variant }} | ${{ matrix.configuration }} | $SHARED_IOS_TFM | $SDK_DEFAULTS | $RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: iOS AOT experiment summary
    if: always()
    needs: ios
    runs-on: ubuntu-latest
    steps:
      - name: Download Experiment Results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ios-aot-experiment-*
          path: experiment-results

      - name: Write Combined Experiment Summary
        if: always()
        shell: bash
        run: |
          result_for() {
            local variant="$1"
            local result_file
            result_file="$(find "experiment-results/ios-aot-experiment-$variant" \
              -type f -name result.txt -print -quit 2>/dev/null || true)"
            if [[ -n "$result_file" ]]; then
              tr -d '\r\n' < "$result_file"
            else
              echo -n "not-run"
            fi
          }

          {
            echo "## iOS Mono AOT Experiment Results"
            echo
            echo "| Variant | Config | Shared iOS TFM | SDK defaults | Result |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| current-control | Release | No | No | $(result_for current-control) |"
            echo "| fork-debug-ios-tfm | Debug | Yes | Yes | $(result_for fork-debug-ios-tfm) |"
            echo "| fork-release-ios-tfm | Release | Yes | Yes | $(result_for fork-release-ios-tfm) |"
            echo "| fork-debug-net10 | Debug | No | Yes | $(result_for fork-debug-net10) |"
          } >> "$GITHUB_STEP_SUMMARY"
