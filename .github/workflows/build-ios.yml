name: Build iOS App (TrollStore Lite Compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 切换 Xcode 到 26.5 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: 安装 MAUI iOS 工作负载
        run: dotnet workload install maui-ios

      - name: 还原依赖 (仅 iOS)
        run: dotnet restore -p:TargetFramework=net9.0-ios

      # 关键修改：使用 build 直接编译出 .app，完全绕过归档和签名
      - name: 编译生成未签名的 .app 包
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false

      - name: 手动打包为 .ipa (兼容 TrollStore Lite)
        run: |
          # 进入编译输出目录
          cd OpenUtauMobile/bin/Debug/net9.0-ios/ios-arm64/
          # 创建 Payload 文件夹并将 .app 移入
          mkdir Payload
          mv OpenUtauMobile.app Payload/
          # 压缩为 .ipa 文件
          zip -r OpenUtauMobile.ipa Payload/

      - name: 上传 .ipa 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-TrollStoreLite
          path: OpenUtauMobile/bin/Debug/net9.0-ios/ios-arm64/OpenUtauMobile.ipa
