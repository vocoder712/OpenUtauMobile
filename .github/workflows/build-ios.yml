name: Reusable iOS ARM64 Mono AOT Build

on:
  workflow_call:
    inputs:
      version:
        description: User-visible product version
        required: true
        type: string
      build_number:
        description: Build number supplied by the caller workflow
        required: true
        type: number
      source_sha:
        description: Exact commit being built
        required: true
        type: string
      action_run_id:
        description: Caller workflow run ID
        required: true
        type: string
      version_lyrics:
        description: 版本歌词
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  ios:
    name: iOS ARM64 Mono AOT unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      Configuration: Release
      RuntimeIdentifier: ios-arm64
      Version: ${{ inputs.version }}
      BuildNumber: ${{ inputs.build_number }}
      SourceCommit: ${{ inputs.source_sha }}
      ActionRunId: ${{ inputs.action_run_id }}
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VersionLyrics: ${{ inputs.version_lyrics }}
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 与下方固定的工作负荷集配套，并满足 global.json 的 latestPatch 策略。
          dotnet-version: '10.0.401'

      - name: Collect Build Metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "BuildTimestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BuildMachine=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/ios-arm64-logs"

      - name: Restore iOS Workload
        shell: bash
        run: |
          set -euo pipefail

          # 固定支持 Xcode 27.0 的工作负荷集，避免后续自动更新导致工具链不匹配。
          dotnet workload restore \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            --version 10.0.401.1 \
            --verbosity minimal

          dotnet workload --info

      - name: Setup native Bazel build tools
        uses: ./.github/actions/setup-worldline
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Publish iOS ARM64 Mono AOT Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_DIR="${GITHUB_WORKSPACE}/artifacts/ios-arm64"
          IPA_PATH="$IPA_DIR/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-mono-aot-unsigned.ipa"
          mkdir -p "$IPA_DIR"

          dotnet publish \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=true \
            -p:IpaPackagePath="$IPA_PATH" \
            -bl:"${GITHUB_WORKSPACE}/artifacts/ios-arm64-logs/build.binlog" \
            --verbosity minimal

          ls -lh "$IPA_PATH"

      - name: Upload iOS Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-arm64-mono-aot-diagnostics
          path: |
            artifacts/ios-arm64-logs
            OpenUtauMobile.iOS/obj/project.assets.json
            OpenUtauMobile.iOS/obj/**/mobile/**
            OpenUtauMobile.iOS/obj/**/*.aotdata.*
          if-no-files-found: warn
          retention-days: 7

      - name: Generate iOS SHA-256 checksum
        shell: bash
        working-directory: artifacts/ios-arm64
        run: |
          set -euo pipefail
          PACKAGE="OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-mono-aot-unsigned.ipa"
          shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256"

      - name: Upload iOS ARM64 Mono AOT Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-arm64-mono-aot-unsigned
          path: |
            artifacts/ios-arm64/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-mono-aot-unsigned.ipa
            artifacts/ios-arm64/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-mono-aot-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
