name: Reusable iOS NativeAOT Build

on:
  workflow_call:
    inputs:
      version:
        description: User-visible product version
        required: true
        type: string
      build_number:
        description: Build number supplied by the caller workflow
        required: true
        type: number
      source_sha:
        description: Exact commit being built
        required: true
        type: string
      action_run_id:
        description: Caller workflow run ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    name: iOS arm64 NativeAOT unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect Build Metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/ios-nativeaot-logs"

      - name: Show iOS Toolchain Summary
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::.NET and installed workloads"
          dotnet --info
          dotnet workload list
          echo "::endgroup::"

          echo "::group::Xcode and iPhoneOS SDK"
          xcode-select -p
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "::endgroup::"

      - name: Restore iOS Workload
        shell: bash
        run: |
          set -euo pipefail

          dotnet workload restore \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            --verbosity minimal

      - name: Validate NativeAOT Entry Properties
        shell: bash
        run: |
          set -euo pipefail

          APP_PUBLISH_AOT="$(dotnet msbuild \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -nologo \
            -getProperty:PublishAot \
            -p:_IsPublishing=true \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableIosNativeAot=true)"
          APP_USE_NATIVE_AOT="$(dotnet msbuild \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -nologo \
            -getProperty:_UseNativeAot \
            -p:_IsPublishing=true \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableIosNativeAot=true)"
          APP_USE_MONO="$(dotnet msbuild \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -nologo \
            -getProperty:UseMonoRuntime \
            -p:_IsPublishing=true \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableIosNativeAot=true)"
          echo "PublishAot=$APP_PUBLISH_AOT _UseNativeAot=$APP_USE_NATIVE_AOT UseMonoRuntime=$APP_USE_MONO"
          if [ "$APP_PUBLISH_AOT" != "true" ] \
            || [ "$APP_USE_NATIVE_AOT" != "true" ] \
            || [ "$APP_USE_MONO" != "false" ]; then
            echo "::error::iOS entry project did not select the NativeAOT runtime"
            exit 1
          fi

          for DEPENDENCY_PROJECT in \
            OpenUtauMobile/OpenUtauMobile.csproj \
            OpenUtau.Core/OpenUtau.Core.csproj \
            OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj \
            OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj; do
            DEPENDENCY_PUBLISH_AOT="$(dotnet msbuild \
              "$DEPENDENCY_PROJECT" \
              -nologo \
              -getProperty:PublishAot \
              -p:_IsPublishing=true \
              -p:Configuration=Release \
              -p:RuntimeIdentifier=ios-arm64 \
              -p:EnableIosNativeAot=true)"
            if [ -n "$DEPENDENCY_PUBLISH_AOT" ]; then
              echo "::error::PublishAot leaked into $DEPENDENCY_PROJECT: $DEPENDENCY_PUBLISH_AOT"
              exit 1
            fi
          done
          echo "Dependency PublishAot: <empty> (4 projects)"

      - name: Publish iOS arm64 NativeAOT Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_DIR="${GITHUB_WORKSPACE}/artifacts/ios-arm64"
          IPA_PATH="$IPA_DIR/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-nativeaot-unsigned.ipa"

          mkdir -p "$IPA_DIR"

          dotnet publish \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            --force \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            -p:Version="${{ inputs.version }}" \
            -p:BuildNumber=${{ inputs.build_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ inputs.source_sha }} \
            -p:ActionRunId=${{ inputs.action_run_id }} \
            -p:EnableIosNativeAot=true \
            -p:BuildIpa=true \
            -p:EnableCodeSigning=false \
            -p:IpaPackagePath="$IPA_PATH" \
            -bl:"${GITHUB_WORKSPACE}/artifacts/ios-nativeaot-logs/publish.binlog" \
            --verbosity minimal

          ls -lh "$IPA_PATH"

      - name: Validate iOS arm64 NativeAOT Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_PATH="${GITHUB_WORKSPACE}/artifacts/ios-arm64/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-nativeaot-unsigned.ipa"
          VERIFY_DIR="${RUNNER_TEMP}/opum-ios-nativeaot-verify"

          unzip -tq "$IPA_PATH"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"

          APP_COUNT="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          if [ "$APP_COUNT" != "1" ]; then
            echo "::error::IPA must contain exactly one app bundle, found $APP_COUNT"
            exit 1
          fi

          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          INFO_PLIST="$APP_DIR/Info.plist"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$INFO_PLIST")"
          PLATFORM="$(plutil -extract CFBundleSupportedPlatforms.0 raw "$INFO_PLIST")"
          ARCHS="$(lipo -archs "$APP_DIR/$EXECUTABLE")"
          EXPECTED_BUNDLE_ID="$(dotnet msbuild \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -nologo \
            -getProperty:ApplicationId \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64)"

          if [ "$BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::Bundle ID is $BUNDLE_ID, expected $EXPECTED_BUNDLE_ID"
            exit 1
          fi

          if [ "$PLATFORM" != "iPhoneOS" ]; then
            echo "::error::IPA targets $PLATFORM instead of iPhoneOS"
            exit 1
          fi

          if [ "$ARCHS" != "arm64" ]; then
            echo "::error::App executable architectures are $ARCHS instead of arm64"
            exit 1
          fi

          MANAGED_FILE_COUNT="$(find "$APP_DIR" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.aotdata.*' \) | wc -l | tr -d ' ')"
          if [ "$MANAGED_FILE_COUNT" != "0" ]; then
            echo "::error::NativeAOT app bundle unexpectedly contains $MANAGED_FILE_COUNT managed or Mono AOT files"
            find "$APP_DIR" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.aotdata.*' \) -print | head -20
            exit 1
          fi

          if [ -e "$APP_DIR/_CodeSignature" ] || [ -e "$APP_DIR/embedded.mobileprovision" ]; then
            echo "::error::App bundle unexpectedly contains signing assets"
            exit 1
          fi

          if codesign --verify --deep --strict "$APP_DIR" 2>"$VERIFY_DIR/codesign.txt"; then
            echo "::error::App bundle unexpectedly passed code-sign verification"
            exit 1
          fi

          echo "Bundle ID: $BUNDLE_ID"
          echo "Platform: $PLATFORM"
          echo "Architectures: $ARCHS"
          echo "Top-level managed/Mono AOT files: $MANAGED_FILE_COUNT"
          tr '\n' ' ' < "$VERIFY_DIR/codesign.txt"
          echo

      - name: Show NativeAOT Failure Summary
        if: failure()
        shell: bash
        run: |
          echo "::group::NativeAOT restore state"
          NUGET_ROOT="$(dotnet nuget locals global-packages --list 2>/dev/null \
            | sed 's/^global-packages: //' || true)"
          if [ -n "$NUGET_ROOT" ] && [ -d "$NUGET_ROOT" ]; then
            echo "NuGet global packages: $NUGET_ROOT"
            find "$NUGET_ROOT" -maxdepth 1 -type d \
              -iname 'microsoft.netcore.app.runtime.nativeaot*' \
              -print 2>/dev/null | sort | sed -n '1,20p'
          else
            echo "NuGet global packages directory is unavailable."
          fi

          ASSETS_FILE="OpenUtauMobile.iOS/obj/project.assets.json"
          if [ -f "$ASSETS_FILE" ]; then
            echo "NativeAOT entries in $ASSETS_FILE:"
            grep -o 'Microsoft.NETCore.App.Runtime.NativeAOT[^"/]\+' "$ASSETS_FILE" \
              | sort -u | sed -n '1,20p' || true
          else
            echo "No project.assets.json was generated."
          fi
          echo "::endgroup::"

          echo "::group::NativeAOT diagnostic files"
          FOUND=0
          while IFS= read -r FILE; do
            FOUND=1
            echo "===== $FILE ====="
            sed -n '1,120p' "$FILE"
          done < <(find OpenUtauMobile.iOS/obj -type f \
            \( -name 'nativeaot-*.txt' -o -name '*ilc*.txt' \) \
            -print 2>/dev/null | sort | head -10)

          if [ "$FOUND" = "0" ]; then
            echo "No NativeAOT text diagnostics were generated; inspect the uploaded MSBuild binlogs."
          fi
          echo "::endgroup::"

      - name: Upload NativeAOT Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-arm64-nativeaot-diagnostics
          path: |
            artifacts/ios-nativeaot-logs
            OpenUtauMobile.iOS/obj/project.assets.json
            OpenUtauMobile.iOS/obj/**/nativeaot-*.txt
            OpenUtauMobile.iOS/obj/**/*ilc*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload iOS arm64 NativeAOT Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-arm64-nativeaot-unsigned
          path: artifacts/ios-arm64/OpenUtauMobile-build${{ inputs.build_number }}-ios-arm64-nativeaot-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
