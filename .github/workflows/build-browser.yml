name: Reusable Browser Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      build_number:
        type: number
        default: 0
      source_sha:
        type: string
        default: ''
      action_run_id:
        type: string
        default: ''
      version_lyrics:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      VersionLyrics: ${{ inputs.version_lyrics }}
      Configuration: Release
      Version: ${{ inputs.version }}
      BuildNumber: ${{ inputs.build_number }}
      SourceCommit: ${{ inputs.source_sha || github.sha }}
      ActionRunId: ${{ inputs.action_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-worldline
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish Browser with Worldline
        run: |
          dotnet publish OpenUtauMobile.Browser/OpenUtauMobile.Browser.csproj \
            -o artifacts/publish/browser-wasm
      - name: Package Browser static files
        run: |
          tar -C artifacts/publish/browser-wasm/wwwroot -czf artifacts/OpenUtauMobile-browser-wasm.tar.gz .
          cd artifacts
          sha256sum OpenUtauMobile-browser-wasm.tar.gz > OpenUtauMobile-browser-wasm.tar.gz.sha256
      - name: Upload Browser package
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-browser-wasm
          path: |
            artifacts/OpenUtauMobile-browser-wasm.tar.gz
            artifacts/OpenUtauMobile-browser-wasm.tar.gz.sha256
          if-no-files-found: error
