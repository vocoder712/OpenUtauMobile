name: Build and Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Build {0} · workflow run #{1}', inputs.version, github.run_number)
      || format('Canary · workflow run #{0} · {1}', github.run_number, github.ref_name) }}

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: Product version without the v prefix (X.Y.Z)
        required: true
        type: string
      release:
        description: GitHub Release behavior after all builds succeed
        required: true
        default: draft
        type: choice
        options:
          - none
          - draft
          - publish
      release_notes:
        description: Optional short text prepended to generated release notes
        required: false
        type: string
      version_lyrics:
        description: 版本歌词
        required: true
        type: string

permissions:
  contents: read

# 正式发布串行执行，避免两个 workflow_dispatch 同时通过版本校验后乱序创建 Tag。
# push 构建使用唯一 run_id 分组，因此不会互相阻塞。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'release' || github.run_id }}
  queue: max

jobs:
  prepare:
    name: Resolve and validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          # 构建号只在入口工作流中计算，再逐层传给可复用工作流；不要改用被调用工作流的运行序号。
          BUILD_NUMBER=$((RUN_NUMBER + 20000))

          # 仅把严格的 vX.Y.Z 视为正式产品版本；忽略 prerelease、Canary 和其他历史 Tag。
          latest_release_tag() {
            git tag --list 'v*' --sort=-version:refname |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              head -n 1 || true
          }

          version_is_greater() {
            local candidate="$1"
            local current="$2"
            local highest

            highest="$(printf '%s\n%s\n' "$current" "$candidate" | sort -V | tail -n 1)"
            [ "$highest" = "$candidate" ] && [ "$candidate" != "$current" ]
          }

          LATEST_TAG="$(latest_release_tag)"

          if [ "$EVENT_NAME" = "push" ]; then
            # Canary 跟随仓库中最高的正式版本，不要求该 Tag 位于当前 HEAD 的祖先历史中。
            # 这样即使 dev 经历 squash/rebase/cherry-pick/强制推送，也不会丢失产品版本基线。
            TAG="$LATEST_TAG"

            if [ -z "$TAG" ]; then
              echo "::error::没有找到符合 vX.Y.Z 格式的正式版本 Tag。请先手动运行一次全平台构建创建正式 Tag。"
              exit 1
            fi

            BASE_VERSION="${TAG#v}"
            VERSION="${BASE_VERSION}-Canary.${BUILD_NUMBER}"
          else
            # 严格使用三段数字版本，并拒绝 01.2.3 之类带前导零的写法。
            if [[ ! "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::版本号必须使用 X.Y.Z 格式，各部分必须为非负整数且不能有前导零，也不能包含前导 'v'。"
              exit 1
            fi

            VERSION="$REQUESTED_VERSION"
            TAG="v${REQUESTED_VERSION}"

            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "::error::Tag $TAG 已经存在；拒绝覆盖。"
              exit 1
            fi

            if [ -n "$LATEST_TAG" ]; then
              LATEST_VERSION="${LATEST_TAG#v}"
              if ! version_is_greater "$REQUESTED_VERSION" "$LATEST_VERSION"; then
                echo "::error::新版本 $REQUESTED_VERSION 必须高于当前最高正式版本 $LATEST_VERSION。"
                exit 1
              fi
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved product version: $VERSION"
          echo "Base release tag: $TAG"
          echo "Build number: $BUILD_NUMBER"

  android-canary:
    name: Android ARM64 Canary
    if: github.event_name == 'push'
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ fromJSON(needs.prepare.outputs.build_number) }}
      source_sha: ${{ github.sha }}
      action_run_id: ${{ github.run_id }}
      arch: arm64
      rid: android-arm64
      version_lyrics: ''
    secrets: inherit

  ios-canary:
    name: iOS ARM64 Mono AOT Canary
    if: github.event_name == 'push'
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-ios.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ fromJSON(needs.prepare.outputs.build_number) }}
      source_sha: ${{ github.sha }}
      action_run_id: ${{ github.run_id }}
      version_lyrics: ''

  all-platforms:
    name: Full platform build
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-all-platforms.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ fromJSON(needs.prepare.outputs.build_number) }}
      source_sha: ${{ github.sha }}
      action_run_id: ${{ github.run_id }}
      version_lyrics: ${{ inputs.version_lyrics }}
    secrets: inherit

  tag-and-release:
    name: Release transaction
    if: github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - all-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_RUN_ID: ${{ github.run_id }}
      RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release artifacts
        if: inputs.release != 'none'
        uses: actions/download-artifact@v8
        with:
          pattern: OpenUtauMobile-*
          path: release-assets
          # 保留产物目录，以便逐平台核对清单，也避免混入失败诊断附件。
          merge-multiple: false

      - name: Stage, upload serially and commit release
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          RELEASE_MODE: ${{ inputs.release }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
          VERSION_LYRICS: ${{ inputs.version_lyrics }}
        run: python3 .github/scripts/release.py release

  rollback-release:
    name: Roll back interrupted release
    # 使用新的 runner 清理，覆盖发布 job 超时或原 runner 异常退出的情况。
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      needs.prepare.result == 'success' &&
      (needs.tag-and-release.result == 'failure' || needs.tag-and-release.result == 'cancelled')
    needs:
      - prepare
      - tag-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Roll back resources owned by this attempt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 .github/scripts/release.py rollback
