name: PR Build

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  worldline-ios:
    name: Worldline ${{ matrix.rid }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        rid: [ios-arm64, iossimulator-arm64, iossimulator-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-worldline
        with:
          architecture: arm64
      - name: Build and verify static archive
        run: python native/worldline/build.py --rid ${{ matrix.rid }}
      - name: Upload native verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: worldline-${{ matrix.rid }}
          path: artifacts/worldline-native/${{ matrix.rid }}/
          if-no-files-found: error

  # 本轮同步的临时全平台验收入口；全部通过后恢复 Android 最小检查。
  full-platforms:
    uses: ./.github/workflows/build-all-platforms.yml
    with:
      version: '0.0.0'
      build_number: ${{ fromJSON(github.run_number) }}
      source_sha: ${{ github.event.pull_request.head.sha }}
      action_run_id: ${{ github.run_id }}
      version_lyrics: ''
      release_signing: false

  native-desktop:
    name: Native ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, runner: windows-latest, arch: x64 }
          - { rid: win-arm64, runner: windows-11-arm, arch: arm64 }
          - { rid: linux-x64, runner: ubuntu-24.04, arch: x64 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64 }
          - { rid: osx-x64, runner: macos-15-intel, arch: x64 }
          - { rid: osx-arm64, runner: macos-15, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-worldline
        with:
          architecture: ${{ matrix.arch }}
      - name: Build and run upstream tests
        shell: bash
        run: |
          python native/worldline/build.py --rid ${{ matrix.rid }} --test
          python native/game/build.py --rid ${{ matrix.rid }} --test
          python native/game/verify.py artifacts/game-native/${{ matrix.rid }} ${{ matrix.rid }} --run
      - name: Verify native ABI
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-*) LIBRARY=worldline.dll ;;
            osx-*) LIBRARY=libworldline.dylib ;;
            *) LIBRARY=libworldline.so ;;
          esac
          python native/worldline/verify.py "artifacts/worldline-native/${{ matrix.rid }}/$LIBRARY" "${{ matrix.rid }}" --run
          case "${{ matrix.rid }}" in
            linux-*) readelf --version-info "artifacts/worldline-native/${{ matrix.rid }}/$LIBRARY" > "artifacts/worldline-native/${{ matrix.rid }}/symbol-versions.txt" ;;
            osx-*) otool -L "artifacts/worldline-native/${{ matrix.rid }}/$LIBRARY" > "artifacts/worldline-native/${{ matrix.rid }}/dylib-dependencies.txt"
                   otool -l "artifacts/worldline-native/${{ matrix.rid }}/$LIBRARY" > "artifacts/worldline-native/${{ matrix.rid }}/load-commands.txt" ;;
          esac
      - name: Upload native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/worldline-native/${{ matrix.rid }}/
            artifacts/game-native/${{ matrix.rid }}/
            artifacts/game-bazel-build/${{ matrix.rid }}/workspace/bazel-testlogs/**/test.log
            artifacts/worldline-build/${{ matrix.rid }}/workspace/bazel-testlogs/**/test.log

  native-android:
    name: Native ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-arm, android-x64, android-x86]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-worldline
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Build with pinned NDK and verify ELF
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="$(tr -d '\r\n' < native/game/android-ndk-version.txt)"
          sdkmanager "ndk;$NDK_VERSION"
          python native/worldline/build.py --rid "${{ matrix.rid }}"
          python native/game/build.py --rid "${{ matrix.rid }}"
      - name: Upload native verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/worldline-native/${{ matrix.rid }}/
            artifacts/game-native/${{ matrix.rid }}/
          if-no-files-found: error

  android-build:
    name: PR build test for Android ARM64
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup native Bazel build tools
        uses: ./.github/actions/setup-worldline

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          NDK_VERSION="$(tr -d '\r\n' < native/game/android-ndk-version.txt)"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is required}}"
          sdkmanager --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION"
          test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"
          echo "OPUM_ANDROID_NDK=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore OpenUtauMobile.Android/OpenUtauMobile.Android.csproj -r android-arm64 -p:Configuration=Release

      - name: Build Android ARM64
        run: |
          dotnet build OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
            -c Release \
            -f net10.0-android36.0 \
            --no-restore \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidNdkDirectory="$OPUM_ANDROID_NDK"

      - name: Verify Android native packaging
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find OpenUtauMobile.Android/bin/Release/net10.0-android36.0/android-arm64 -maxdepth 1 -type f -iname '*-signed.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed APK; found ${#APKS[@]}"
            exit 1
          fi
          python native/verify-android-runtime.py "${APKS[0]}" android-arm64
