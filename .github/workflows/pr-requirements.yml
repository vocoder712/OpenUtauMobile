name: PR Build

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  android-build:
    name: PR build test for Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore OpenUtauMobile.Android/OpenUtauMobile.Android.csproj

      - name: Build Android ARM64
        run: |
          dotnet build OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
            -c Release \
            -f net10.0-android36.0 \
            -p:RuntimeIdentifier=android-arm64

  ios-build:
    name: PR build test for iOS Intel Simulator Mono AOT LLVM
    runs-on: macos-26
    timeout-minutes: 90
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate iOS Toolchain
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Required Xcode developer directory is missing: $DEVELOPER_DIR"
            ls -1d /Applications/Xcode_*.app 2>/dev/null | sed -n '1,20p' || true
            exit 1
          fi

          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          if [[ "$XCODE_VERSION" != "26.6" && "$XCODE_VERSION" != 26.6.* ]]; then
            echo "::error::Expected Xcode 26.6, selected $XCODE_VERSION from $DEVELOPER_DIR"
            exit 1
          fi

          dotnet --version
          xcodebuild -version
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Restore iOS Workload
        shell: bash
        run: |
          set -euo pipefail

          dotnet workload restore \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            --verbosity minimal

      - name: Validate Mono AOT LLVM Properties
        shell: bash
        run: |
          set -euo pipefail

          APP_PROPERTIES="$(dotnet msbuild \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -nologo \
            -getProperty:PublishAot,_UseNativeAot,UseMonoRuntime,MtouchUseLlvm,UseInterpreter,TrimMode,EnableAssemblyILStripping \
            -p:_IsPublishing=true \
            -p:Configuration=Release \
            -p:TargetFramework=net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-x64)"
          echo "$APP_PROPERTIES"

          if ! echo "$APP_PROPERTIES" | grep -q '"PublishAot": "false"' \
            || ! echo "$APP_PROPERTIES" | grep -q '"UseMonoRuntime": "true"' \
            || ! echo "$APP_PROPERTIES" | grep -q '"MtouchUseLlvm": "true"' \
            || ! echo "$APP_PROPERTIES" | grep -q '"UseInterpreter": "false"' \
            || ! echo "$APP_PROPERTIES" | grep -q '"TrimMode": "copy"' \
            || ! echo "$APP_PROPERTIES" | grep -q '"EnableAssemblyILStripping": "false"'; then
            echo "::error::iOS simulator entry project did not select Mono AOT with LLVM"
            exit 1
          fi

          if echo "$APP_PROPERTIES" | grep -q '"_UseNativeAot": "true"'; then
            echo "::error::iOS simulator entry project unexpectedly selected NativeAOT"
            exit 1
          fi

      - name: Build iOS Intel Simulator Mono AOT LLVM App
        shell: bash
        run: |
          set -euo pipefail

          LOG_DIR="${GITHUB_WORKSPACE}/artifacts/iossimulator-x64-logs"
          BUILD_NUMBER=$((${{ github.run_number }} + 20000))
          mkdir -p "$LOG_DIR"

          dotnet build \
            OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            --force \
            -c Release \
            -f net10.0-ios \
            -r iossimulator-x64 \
            -p:Version="0.0.0-pr.${{ github.event.pull_request.number }}" \
            -p:BuildNumber="$BUILD_NUMBER" \
            -p:BuildTimestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -p:BuildMachine="${RUNNER_OS} / $(uname -srm)" \
            -p:SourceCommit=${{ github.sha }} \
            -p:ActionRunId=${{ github.run_id }} \
            -p:PublishAot=false \
            -p:MtouchUseLlvm=true \
            -p:UseInterpreter=false \
            -p:TrimMode=copy \
            -p:EnableAssemblyILStripping=false \
            -p:EnableCodeSigning=true \
            -p:CodesignKey=- \
            -p:BuildIpa=false \
            -bl:"$LOG_DIR/build.binlog" \
            --verbosity minimal

      - name: Validate and Package Simulator App
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="OpenUtauMobile.iOS/bin/Release/net10.0-ios/iossimulator-x64"
          APP_DIR="$OUTPUT_DIR/OpenUtauMobile.iOS.app"
          PACKAGE_DIR="${GITHUB_WORKSPACE}/artifacts/iossimulator-x64"
          STAGE_DIR="${RUNNER_TEMP}/OpenUtauMobile-iossimulator-x64-mono-llvm"
          ZIP_PATH="$PACKAGE_DIR/OpenUtauMobile-pr${{ github.event.pull_request.number }}-iossimulator-x64-mono-llvm.zip"

          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Simulator app bundle was not generated at $APP_DIR"
            find "$OUTPUT_DIR" -maxdepth 2 -print 2>/dev/null | sed -n '1,40p' || true
            exit 1
          fi

          INFO_PLIST="$APP_DIR/Info.plist"
          EXECUTABLE="$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$INFO_PLIST")"
          DISPLAY_VERSION="$(plutil -extract CFBundleShortVersionString raw "$INFO_PLIST")"
          BUILD_VERSION="$(plutil -extract CFBundleVersion raw "$INFO_PLIST")"
          PLATFORM="$(plutil -extract CFBundleSupportedPlatforms.0 raw "$INFO_PLIST")"
          ARCHS="$(lipo -archs "$APP_DIR/$EXECUTABLE")"
          EXPECTED_DISPLAY_VERSION="0.0.0-pr.${{ github.event.pull_request.number }}"
          EXPECTED_BUILD_VERSION=$((${{ github.run_number }} + 20000))

          if [ "$DISPLAY_VERSION" != "$EXPECTED_DISPLAY_VERSION" ]; then
            echo "::error::CFBundleShortVersionString is $DISPLAY_VERSION, expected $EXPECTED_DISPLAY_VERSION"
            exit 1
          fi
          if [ "$BUILD_VERSION" != "$EXPECTED_BUILD_VERSION" ]; then
            echo "::error::CFBundleVersion is $BUILD_VERSION, expected $EXPECTED_BUILD_VERSION"
            exit 1
          fi

          if [ "$PLATFORM" != "iPhoneSimulator" ]; then
            echo "::error::App targets $PLATFORM instead of iPhoneSimulator"
            exit 1
          fi
          if [ "$ARCHS" != "x86_64" ]; then
            echo "::error::App executable architectures are $ARCHS instead of x86_64"
            exit 1
          fi

          SIGNATURE_INFO="$(codesign -dvv "$APP_DIR" 2>&1)"
          if ! codesign --verify --deep --strict --verbose=2 "$APP_DIR"; then
            echo "::error::Simulator app bundle failed code-sign verification"
            exit 1
          fi
          if ! echo "$SIGNATURE_INFO" | grep -q '^Signature=adhoc$'; then
            echo "::error::Simulator app bundle does not use an ad-hoc signature"
            echo "$SIGNATURE_INFO" | grep -E '^(Identifier|Signature|TeamIdentifier)=' || true
            exit 1
          fi

          MANAGED_FILE_COUNT="$(find "$APP_DIR" -type f \( -name '*.dll' -o -name '*.aotdata.*' \) | wc -l | tr -d ' ')"

          mkdir -p "$PACKAGE_DIR" "$STAGE_DIR"
          ditto "$APP_DIR" "$STAGE_DIR/OpenUtauMobile.iOS.app"
          if [ -d "$APP_DIR.dSYM" ]; then
            ditto "$APP_DIR.dSYM" "$STAGE_DIR/OpenUtauMobile.iOS.app.dSYM"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$STAGE_DIR" "$ZIP_PATH"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $DISPLAY_VERSION ($BUILD_VERSION)"
          echo "Platform: $PLATFORM"
          echo "Architectures: $ARCHS"
          echo "Code signature: ad-hoc, verified"
          echo "Managed/Mono AOT files: $MANAGED_FILE_COUNT"
          ls -lh "$ZIP_PATH"

      - name: Upload iOS Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iossimulator-x64-mono-llvm-diagnostics
          path: |
            artifacts/iossimulator-x64-logs
            OpenUtauMobile.iOS/obj/project.assets.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload iOS Intel Simulator Mono AOT LLVM App
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iossimulator-x64-mono-llvm
          path: artifacts/iossimulator-x64/*.zip
          if-no-files-found: error
          retention-days: 7
