name: Reusable Full Platform Build

on:
  workflow_call:
    inputs:
      version:
        description: User-visible product version
        required: true
        type: string
      build_number:
        description: Build number supplied by the caller workflow
        required: true
        type: number
      source_sha:
        description: Exact commit being built
        required: true
        type: string
      action_run_id:
        description: Caller workflow run ID
        required: true
        type: string
      version_lyrics:
        description: 版本歌词
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  VersionLyrics: ${{ inputs.version_lyrics }}

jobs:
  # ============================================================
  # Android
  # ============================================================
  android:
    name: Android ${{ matrix.arch }}
    strategy:
      fail-fast: false
      # 矩阵
      matrix:
        include:
          - arch: arm64
            rid: android-arm64

          - arch: armhf
            rid: android-arm

          - arch: x64
            rid: android-x64
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ inputs.build_number }}
      source_sha: ${{ inputs.source_sha }}
      action_run_id: ${{ inputs.action_run_id }}
      arch: ${{ matrix.arch }}
      rid: ${{ matrix.rid }}
      version_lyrics: ${{ inputs.version_lyrics }}
    secrets: inherit


  # ============================================================
  # Linux
  # ============================================================
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            runner: ubuntu-latest

          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect Build Metadata
        shell: bash
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"

      - name: Publish Linux ${{ matrix.arch }}
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"

          dotnet publish \
            OpenUtauMobile.Linux/OpenUtauMobile.Linux.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishDir="$PUBLISH_DIR/" \
            -p:Version="${{ inputs.version }}" \
            -p:BuildNumber=${{ inputs.build_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ inputs.source_sha }} \
            -p:ActionRunId=${{ inputs.action_run_id }}

      - name: Setup native verification interpreter
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Verify native runtime loading
        shell: bash
        run: python native/verify-runtime.py "artifacts/publish/${{ matrix.rid }}"

      - name: Package Linux ${{ matrix.arch }}
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"
          PACKAGE="${GITHUB_WORKSPACE}/artifacts/OpenUtauMobile-build${{ inputs.build_number }}-linux-${{ matrix.arch }}.tar.gz"

          chmod +x "$PUBLISH_DIR/OpenUtauMobile.Linux" || true

          tar \
            -C "$PUBLISH_DIR" \
            -czf "$PACKAGE" \
            .

          ls -lh "$PACKAGE"

      - name: Upload Linux ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-linux-${{ matrix.arch }}
          path: artifacts/OpenUtauMobile-build${{ inputs.build_number }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0


  # ============================================================
  # Windows
  # ============================================================
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            runner: windows-latest

          - arch: arm64
            rid: win-arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect Build Metadata
        shell: pwsh
        run: |
          $timestamp = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")

          "BUILD_TIMESTAMP=$timestamp" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "BUILD_MACHINE=$env:RUNNER_OS / $env:PROCESSOR_ARCHITECTURE" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish Windows ${{ matrix.arch }}
        shell: pwsh
        run: |
          $publishDir = "$env:GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}"

          dotnet publish `
            OpenUtauMobile.Windows/OpenUtauMobile.Windows.csproj `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            -p:PublishDir="$publishDir/" `
            -p:Version="${{ inputs.version }}" `
            -p:BuildNumber=${{ inputs.build_number }} `
            -p:BuildTimestamp="$env:BUILD_TIMESTAMP" `
            -p:BuildMachine="$env:BUILD_MACHINE" `
            -p:SourceCommit=${{ inputs.source_sha }} `
            -p:ActionRunId=${{ inputs.action_run_id }}

      - name: Setup native verification interpreter
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Verify native runtime loading
        shell: bash
        run: python native/verify-runtime.py "artifacts/publish/${{ matrix.rid }}"

      - name: Package Windows ${{ matrix.arch }}
        shell: pwsh
        run: |
          $publishDir = "$env:GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}"

          $package = "$env:GITHUB_WORKSPACE/artifacts/OpenUtauMobile-build${{ inputs.build_number }}-windows-${{ matrix.arch }}.zip"

          Compress-Archive `
            -Path "$publishDir/*" `
            -DestinationPath "$package" `
            -CompressionLevel Optimal `
            -Force

          Get-Item $package

      - name: Upload Windows ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-windows-${{ matrix.arch }}
          path: artifacts/OpenUtauMobile-build${{ inputs.build_number }}-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0


  # ============================================================
  # macOS
  # ============================================================
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: osx-x64
            native_arch: x86_64
            runner: macos-15-intel

          - arch: arm64
            rid: osx-arm64
            native_arch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect Build Metadata
        shell: bash
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"

      - name: Publish macOS ${{ matrix.arch }}
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"

          dotnet publish \
            OpenUtauMobile.MacOS/OpenUtauMobile.MacOS.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishDir="$PUBLISH_DIR/" \
            -p:Version="${{ inputs.version }}" \
            -p:BuildNumber=${{ inputs.build_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ inputs.source_sha }} \
            -p:ActionRunId=${{ inputs.action_run_id }}

      - name: Setup native verification interpreter
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Verify native runtime loading
        shell: bash
        run: python native/verify-runtime.py "artifacts/publish/${{ matrix.rid }}"

      - name: Package macOS ${{ matrix.arch }}
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"
          PACKAGE="${GITHUB_WORKSPACE}/artifacts/OpenUtauMobile-build${{ inputs.build_number }}-macos-${{ matrix.arch }}.tar.gz"

          chmod +x "$PUBLISH_DIR/OpenUtauMobile.MacOS" || true

          tar \
            -C "$PUBLISH_DIR" \
            -czf "$PACKAGE" \
            .

          ls -lh "$PACKAGE"

      - name: Upload macOS ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-macos-${{ matrix.arch }}
          path: artifacts/OpenUtauMobile-build${{ inputs.build_number }}-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0


  # ============================================================
  # iOS
  # ============================================================
  ios:
    name: iOS arm64 Mono AOT unsigned IPA
    uses: ./.github/workflows/build-ios.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ inputs.build_number }}
      source_sha: ${{ inputs.source_sha }}
      action_run_id: ${{ inputs.action_run_id }}
      version_lyrics: ${{ inputs.version_lyrics }}
