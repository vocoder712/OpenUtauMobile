name: Build All Platforms

run-name: "Build All Platforms #${{ github.run_number }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Android
  # ============================================================
  android:
    name: Android ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # 矩阵
      matrix:
        include:
          - arch: arm64
            rid: android-arm64

          - arch: armhf
            rid: android-arm

          - arch: x64
            rid: android-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android

      # 交换分区
      - name: Create Swap Space
        shell: bash
        run: |
          SWAP_FILE=/runner-swapfile

          if [ ! -f "$SWAP_FILE" ]; then
            sudo fallocate -l 6G "$SWAP_FILE"
            sudo chmod 600 "$SWAP_FILE"
            sudo mkswap "$SWAP_FILE"
          fi

          sudo swapon "$SWAP_FILE" 2>/dev/null || true
          free -h
          swapon --show

      - name: Collect Build Metadata
        shell: bash
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"

      - name: Decode Android Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing.keystore

      # 核心构建步骤
      - name: Publish Android ${{ matrix.arch }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish \
            OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
            -c Release \
            -f net10.0-android36.0 \
            -r "${{ matrix.rid }}" \
            -p:BuildNumber=${{ github.run_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ github.sha }} \
            -p:ActionRunId=${{ github.run_id }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="${{ github.workspace }}/signing.keystore" \
            -p:AndroidSigningStorePass="$KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASSWORD"

      - name: Prepare Android Artifact
        shell: bash
        run: |
          PUBLISH_DIR="OpenUtauMobile.Android/bin/Release/net10.0-android36.0/${{ matrix.rid }}/publish"
          ARTIFACT_DIR="artifacts/android-${{ matrix.arch }}"

          mkdir -p "$ARTIFACT_DIR"

          echo "===== Publish files ====="
          find "$PUBLISH_DIR" -maxdepth 1 -type f -printf '%f\n'

          SIGNED_APK="$(
            find "$PUBLISH_DIR" \
              -maxdepth 1 \
              -type f \
              -iname '*-signed.apk' \
              -print \
              -quit
          )"

          if [ -z "$SIGNED_APK" ]; then
            echo "::error::无法找到已签名的 APK"
            exit 1
          fi

          cp "$SIGNED_APK" \
            "$ARTIFACT_DIR/OpenUtauMobile-build${{ github.run_number }}-android-${{ matrix.arch }}.apk"

      - name: Upload Android ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-android-${{ matrix.arch }}
          path: artifacts/android-${{ matrix.arch }}/OpenUtauMobile-build${{ github.run_number }}-android-${{ matrix.arch }}.apk
          if-no-files-found: error
          compression-level: 0


  # ============================================================
  # Linux
  # ============================================================
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            runner: ubuntu-latest

          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect Build Metadata
        shell: bash
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"

      - name: Publish Linux ${{ matrix.arch }}
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"

          dotnet publish \
            OpenUtauMobile.Linux/OpenUtauMobile.Linux.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishDir="$PUBLISH_DIR/" \
            -p:BuildNumber=${{ github.run_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ github.sha }} \
            -p:ActionRunId=${{ github.run_id }}

      # 再次显式复制当前 RID 的 worldline，保证架构正确
      - name: Select Correct Linux Native Library
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"
          NATIVE_LIB="$PUBLISH_DIR/runtimes/${{ matrix.rid }}/native/libworldline.so"

          if [ ! -f "$NATIVE_LIB" ]; then
            echo "::error::Cannot find $NATIVE_LIB"
            exit 1
          fi

          cp -f "$NATIVE_LIB" "$PUBLISH_DIR/libworldline.so"

          echo "===== Executable ====="
          file "$PUBLISH_DIR/OpenUtauMobile.Linux" || true

          echo "===== worldline ====="
          file "$PUBLISH_DIR/libworldline.so"

      - name: Package Linux ${{ matrix.arch }}
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"
          PACKAGE="${GITHUB_WORKSPACE}/artifacts/OpenUtauMobile-build${{ github.run_number }}-linux-${{ matrix.arch }}.tar.gz"

          chmod +x "$PUBLISH_DIR/OpenUtauMobile.Linux" || true

          tar \
            -C "$PUBLISH_DIR" \
            -czf "$PACKAGE" \
            .

          ls -lh "$PACKAGE"

      - name: Upload Linux ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-linux-${{ matrix.arch }}
          path: artifacts/OpenUtauMobile-build${{ github.run_number }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0


  # ============================================================
  # Windows
  # ============================================================
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            runner: windows-latest

          - arch: arm64
            rid: win-arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect Build Metadata
        shell: pwsh
        run: |
          $timestamp = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")

          "BUILD_TIMESTAMP=$timestamp" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "BUILD_MACHINE=$env:RUNNER_OS / $env:PROCESSOR_ARCHITECTURE" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish Windows ${{ matrix.arch }}
        shell: pwsh
        run: |
          $publishDir = "$env:GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}"

          dotnet publish `
            OpenUtauMobile.Windows/OpenUtauMobile.Windows.csproj `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            -p:PublishDir="$publishDir/" `
            -p:BuildNumber=${{ github.run_number }} `
            -p:BuildTimestamp="$env:BUILD_TIMESTAMP" `
            -p:BuildMachine="$env:BUILD_MACHINE" `
            -p:SourceCommit=${{ github.sha }} `
            -p:ActionRunId=${{ github.run_id }}

      # 明确覆盖为本 RID 对应的 worldline.dll
      - name: Select Correct Windows Native Library
        shell: pwsh
        run: |
          $publishDir = "$env:GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}"
          $native = Join-Path `
            $publishDir `
            "runtimes/${{ matrix.rid }}/native/worldline.dll"

          if (!(Test-Path $native)) {
            throw "Cannot find native library: $native"
          }

          Copy-Item `
            $native `
            (Join-Path $publishDir "worldline.dll") `
            -Force

          Get-ChildItem $publishDir |
            Select-Object Name, Length

      - name: Package Windows ${{ matrix.arch }}
        shell: pwsh
        run: |
          $publishDir = "$env:GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}"

          $package = "$env:GITHUB_WORKSPACE/artifacts/OpenUtauMobile-build${{ github.run_number }}-windows-${{ matrix.arch }}.zip"

          Compress-Archive `
            -Path "$publishDir/*" `
            -DestinationPath "$package" `
            -CompressionLevel Optimal `
            -Force

          Get-Item $package

      - name: Upload Windows ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-windows-${{ matrix.arch }}
          path: artifacts/OpenUtauMobile-build${{ github.run_number }}-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0


  # ============================================================
  # macOS
  # ============================================================
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: osx-x64
            native_arch: x86_64
            runner: macos-15-intel

          - arch: arm64
            rid: osx-arm64
            native_arch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Collect Build Metadata
        shell: bash
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"

      - name: Publish macOS ${{ matrix.arch }}
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"

          dotnet publish \
            OpenUtauMobile.MacOS/OpenUtauMobile.MacOS.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishDir="$PUBLISH_DIR/" \
            -p:BuildNumber=${{ github.run_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ github.sha }} \
            -p:ActionRunId=${{ github.run_id }}

      - name: Validate macOS Native Library
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"
          DYLIB="$PUBLISH_DIR/runtimes/osx/native/libworldline.dylib"

          if [ ! -f "$DYLIB" ]; then
            echo "::error::Cannot find libworldline.dylib"
            exit 1
          fi

          echo "===== libworldline.dylib ====="
          file "$DYLIB"
          lipo -info "$DYLIB"

          ARCHS="$(lipo -archs "$DYLIB")"

          echo "$ARCHS" |
            tr ' ' '\n' |
            grep -qx "${{ matrix.native_arch }}" || {
              echo "::error::libworldline.dylib does not contain ${{ matrix.native_arch }}"
              exit 1
            }

          cp -f "$DYLIB" "$PUBLISH_DIR/libworldline.dylib"

      - name: Package macOS ${{ matrix.arch }}
        shell: bash
        run: |
          PUBLISH_DIR="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.rid }}"
          PACKAGE="${GITHUB_WORKSPACE}/artifacts/OpenUtauMobile-build${{ github.run_number }}-macos-${{ matrix.arch }}.tar.gz"

          chmod +x "$PUBLISH_DIR/OpenUtauMobile.MacOS" || true

          tar \
            -C "$PUBLISH_DIR" \
            -czf "$PACKAGE" \
            .

          ls -lh "$PACKAGE"

      - name: Upload macOS ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-macos-${{ matrix.arch }}
          path: artifacts/OpenUtauMobile-build${{ github.run_number }}-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0