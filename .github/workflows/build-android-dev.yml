name: Build Android Dev

on:
  # 推送到 dev 分支
  push:
    branches:
      - dev
  # 手动调度
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    # 运行环境
    runs-on: ubuntu-latest
    
    steps:
      # 创建交换空间，避免内存不足导致构建失败
      - name: Create Swap Space
        run: |
          SWAP_FILE=/runner-swapfile
          if [ ! -f "$SWAP_FILE" ]; then
            sudo fallocate -l 6G "$SWAP_FILE"
            sudo chmod 600 "$SWAP_FILE"
            sudo mkswap "$SWAP_FILE"
          fi
          sudo swapon "$SWAP_FILE" 2>/dev/null || true
          echo "===== Swap status ====="
          free -h
          swapon --show
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      # 安装 dotnet
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # 安装 android 工作负载
      - name: Install Android workload
        run: |
          dotnet workload install android
      # 安装 java 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # 收集写入程序集的构建信息
      - name: Collect Build Metadata
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${{ runner.os }} / $(uname -srm)" >> "$GITHUB_ENV"
      # 下载密钥
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
      # 还原 nuget
      - name: Restore
        run: dotnet restore OpenUtauMobile.Android/OpenUtauMobile.Android.csproj
      # 核心发布命令
      # 构建 Release 模式 | 目标框架 net10.0-android36.0 | 仅打包 arm64 架构的 APK
      - name: Publish Android ARM64
        run: |
          dotnet publish OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
            -c Release \
            -f net10.0-android36.0 \
            -p:BuildNumber=${{ github.run_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ github.sha }} \
            -p:ActionRunId=${{ github.run_id }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=${{ github.workspace }}/signing.keystore \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -p:RuntimeIdentifier=android-arm64
      - name: Prepare APK Artifact
        shell: bash
        run: |
          PUBLISH_DIR="OpenUtauMobile.Android/bin/Release/net10.0-android36.0/android-arm64/publish"
          ARTIFACT_DIR="artifacts/android-arm64"
      
          echo "===== 准备上传 ====="
          find "$PUBLISH_DIR" -maxdepth 1 -type f -printf '%f\n'
      
          mkdir -p "$ARTIFACT_DIR"
      
          SIGNED_APK="$(find "$PUBLISH_DIR" -maxdepth 1 -type f \
            \( -iname '*-signed.apk' \) \
            | head -n 1)"
      
          if [ -z "$SIGNED_APK" ]; then
            echo "::error::找不到已签名的 APK 文件"
            exit 1
          fi
      
          cp "$SIGNED_APK" \
            "$ARTIFACT_DIR/OpenUtauMobile-预览版-build${{ github.run_number }}-arm64.apk"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-android-arm64
          path: artifacts/android-arm64/OpenUtauMobile-预览版-build${{ github.run_number }}-arm64.apk
          if-no-files-found: error