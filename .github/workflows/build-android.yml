name: Reusable Android Build

on:
  workflow_call:
    inputs:
      version:
        description: User-visible product version
        required: true
        type: string
      build_number:
        description: Build number supplied by the caller workflow
        required: true
        type: number
      source_sha:
        description: Exact commit being built
        required: true
        type: string
      action_run_id:
        description: Caller workflow run ID
        required: true
        type: string
      arch:
        description: Artifact architecture name
        required: true
        type: string
      rid:
        description: .NET Android runtime identifier
        required: true
        type: string
      version_lyrics:
        description: 版本歌词
        required: false
        default: ''
        type: string
      release_signing:
        description: Use the release Android keystore; PR validation uses debug signing
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  VersionLyrics: ${{ inputs.version_lyrics }}

jobs:
  build:
    name: Android ${{ inputs.arch }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup native Bazel build tools
        uses: ./.github/actions/setup-worldline

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="$(tr -d '\r\n' < native/game/android-ndk-version.txt)"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is required}}"
          sdkmanager --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION"
          echo "OPUM_ANDROID_NDK=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Create Swap Space
        shell: bash
        run: |
          SWAP_FILE=/runner-swapfile
          if [ ! -f "$SWAP_FILE" ]; then
            sudo fallocate -l 6G "$SWAP_FILE"
            sudo chmod 600 "$SWAP_FILE"
            sudo mkswap "$SWAP_FILE"
          fi
          sudo swapon "$SWAP_FILE" 2>/dev/null || true
          free -h
          swapon --show

      - name: Collect Build Metadata
        shell: bash
        run: |
          echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_MACHINE=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"

      - name: Decode Android Keystore
        if: inputs.release_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing.keystore

      # 必须按最终 RID 显式还原；发布阶段复用同一资产图，防止宿主平台原生资产混入 APK。
      # 全局指定 Mono，让引用的普通 .NET 类库也使用 Mono，避免 armhf 请求不存在的 CoreCLR linux-bionic-arm 包。
      - name: Restore Android ${{ inputs.arch }}
        shell: bash
        run: |
          dotnet restore OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
            -r "${{ inputs.rid }}" \
            -p:UseMonoRuntime=true \
            -p:Configuration=Release

      - name: Publish Android ${{ inputs.arch }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_SIGNING: ${{ inputs.release_signing }}
        run: |
          set -euo pipefail
          signing_args=(-p:AndroidKeyStore=false)
          if [ "$RELEASE_SIGNING" = "true" ]; then
            signing_args=(-p:AndroidKeyStore=true
              "-p:AndroidSigningKeyStore=$GITHUB_WORKSPACE/signing.keystore"
              "-p:AndroidSigningStorePass=$KEYSTORE_PASSWORD"
              "-p:AndroidSigningKeyAlias=$KEY_ALIAS"
              "-p:AndroidSigningKeyPass=$KEY_PASSWORD")
          fi
          dotnet publish OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
            --no-restore \
            -c Release \
            -f net10.0-android36.0 \
            -r "${{ inputs.rid }}" \
            -p:UseMonoRuntime=true \
            -p:Version="${{ inputs.version }}" \
            -p:BuildNumber=${{ inputs.build_number }} \
            -p:BuildTimestamp="$BUILD_TIMESTAMP" \
            -p:BuildMachine="$BUILD_MACHINE" \
            -p:SourceCommit=${{ inputs.source_sha }} \
            -p:ActionRunId=${{ inputs.action_run_id }} \
            -p:AndroidNdkDirectory="$OPUM_ANDROID_NDK" \
            -p:AndroidPackageFormat=apk \
            "${signing_args[@]}"

      - name: Prepare Android artifact
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="OpenUtauMobile.Android/bin/Release/net10.0-android36.0/${{ inputs.rid }}/publish"
          ARTIFACT_DIR="artifacts/android-${{ inputs.arch }}"
          mkdir -p "$ARTIFACT_DIR"
          SIGNED_APK="$(find "$PUBLISH_DIR" -maxdepth 1 -type f -iname '*-signed.apk' -print -quit)"
          cp "$SIGNED_APK" \
            "$ARTIFACT_DIR/OpenUtauMobile-build${{ inputs.build_number }}-android-${{ inputs.arch }}.apk"

      - name: Generate Android SHA-256 checksum
        shell: bash
        working-directory: artifacts/android-${{ inputs.arch }}
        run: |
          set -euo pipefail
          PACKAGE="OpenUtauMobile-build${{ inputs.build_number }}-android-${{ inputs.arch }}.apk"
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"

      - name: Upload Android ${{ inputs.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: OpenUtauMobile-android-${{ inputs.arch }}
          path: |
            artifacts/android-${{ inputs.arch }}/OpenUtauMobile-build${{ inputs.build_number }}-android-${{ inputs.arch }}.apk
            artifacts/android-${{ inputs.arch }}/OpenUtauMobile-build${{ inputs.build_number }}-android-${{ inputs.arch }}.apk.sha256
          if-no-files-found: error
          compression-level: 0
