name: Reusable Android Build

on:
  workflow_call:
    inputs:
      version:
        description: User-visible product version
        required: true
        type: string
      build_number:
        description: Build number supplied by the caller workflow
        required: true
        type: number
      source_sha:
        description: Exact commit being built
        required: true
        type: string
      action_run_id:
        description: Caller workflow run ID
        required: true
        type: string
      arch:
        description: Artifact architecture name
        required: true
        type: string
      rid:
        description: .NET Android runtime identifier
        required: true
        type: string
      version_lyrics:
        description: 版本歌词
        required: false
        default: ''
        type: string
      release_signing:
        description: Use the release Android keystore; PR validation uses debug signing
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  VersionLyrics: ${{ inputs.version_lyrics }}
  Configuration: Release
  RuntimeIdentifier: ${{ inputs.rid }}
  Version: ${{ inputs.version }}
  BuildNumber: ${{ inputs.build_number }}
  SourceCommit: ${{ inputs.source_sha }}
  ActionRunId: ${{ inputs.action_run_id }}

jobs:
  build:
    name: Android ${{ inputs.arch }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install Android workload
        run: dotnet workload install android

      - name: Setup native Bazel build tools
        uses: ./.github/actions/setup-worldline

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;$(tr -d '\r\n' < native/android-ndk-version.txt)"

      - name: Create Swap Space
        shell: bash
        run: |
          SWAP_FILE=/runner-swapfile
          sudo fallocate -l 6G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"

      - name: Collect Build Metadata
        shell: bash
        run: |
          echo "BuildTimestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BuildMachine=${RUNNER_OS} / $(uname -srm)" >> "$GITHUB_ENV"

      - name: Decode Android Keystore
        if: inputs.release_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing.keystore

      - name: Publish Android ${{ inputs.arch }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_SIGNING: ${{ inputs.release_signing }}
        run: |
          set -euo pipefail
          signing_args=(-p:AndroidKeyStore=false)
          if [ "$RELEASE_SIGNING" = "true" ]; then
            signing_args=(-p:AndroidKeyStore=true
              "-p:AndroidSigningKeyStore=$GITHUB_WORKSPACE/signing.keystore"
              "-p:AndroidSigningStorePass=$KEYSTORE_PASSWORD"
              "-p:AndroidSigningKeyAlias=$KEY_ALIAS"
              "-p:AndroidSigningKeyPass=$KEY_PASSWORD")
          fi
          dotnet publish OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
            "${signing_args[@]}"

      - name: Prepare Android artifact
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="OpenUtauMobile.Android/bin/Release/net10.0-android36.0/${{ inputs.rid }}/publish"
          ARTIFACT_DIR="artifacts/android-${{ inputs.arch }}"
          mkdir -p "$ARTIFACT_DIR"
          SIGNED_APK="$(find "$PUBLISH_DIR" -maxdepth 1 -type f -iname '*-signed.apk' -print -quit)"
          cp "$SIGNED_APK" \
            "$ARTIFACT_DIR/OpenUtauMobile-build${{ inputs.build_number }}-android-${{ inputs.arch }}.apk"

      - name: Generate Android SHA-256 checksum
        shell: bash
        working-directory: artifacts/android-${{ inputs.arch }}
        run: |
          set -euo pipefail
          PACKAGE="OpenUtauMobile-build${{ inputs.build_number }}-android-${{ inputs.arch }}.apk"
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"

      - name: Upload Android ${{ inputs.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: OpenUtauMobile-android-${{ inputs.arch }}
          path: |
            artifacts/android-${{ inputs.arch }}/OpenUtauMobile-build${{ inputs.build_number }}-android-${{ inputs.arch }}.apk
            artifacts/android-${{ inputs.arch }}/OpenUtauMobile-build${{ inputs.build_number }}-android-${{ inputs.arch }}.apk.sha256
          if-no-files-found: error
          compression-level: 0
